<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Release · 软件下载中心</title>
  <meta name="description" content="SAP Release 发布中心 —— 各工具的最新版下载入口与版本说明。" />
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a30;
      --card: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.09);
      --text: #e8edf7;
      --text-dim: #9aa6c2;
      --brand: #5b8cff;
      --brand-2: #9b6bff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --radius: 18px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fb;
        --bg-soft: #ffffff;
        --card: #ffffff;
        --card-border: rgba(20, 30, 60, 0.08);
        --text: #14213d;
        --text-dim: #5a6685;
        --shadow: 0 20px 50px rgba(20, 40, 90, 0.12);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(91, 140, 255, 0.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(155, 107, 255, 0.16), transparent 55%),
        var(--bg);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 22px 64px; }

    header.hero { text-align: center; padding: 72px 0 12px; }
    .logo {
      width: 84px; height: 84px; margin: 0 auto 18px;
      border-radius: 24px; display: grid; place-items: center;
      background: linear-gradient(140deg, var(--brand), var(--brand-2));
      box-shadow: 0 14px 40px rgba(91, 140, 255, 0.35);
    }
    .logo svg { width: 44px; height: 44px; }
    h1 {
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: 0.5px;
      background: linear-gradient(120deg, var(--text), var(--brand));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline { color: var(--text-dim); margin-top: 10px; font-size: 16px; }
    .link-placeholder { visibility: hidden; }

    section { margin-top: 48px; }
    .section-title {
      font-size: 22px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
    }
    .section-title::before {
      content: ""; width: 4px; height: 22px; border-radius: 4px;
      background: linear-gradient(var(--brand), var(--brand-2));
    }
    .count { font-size: 13px; font-weight: 400; color: var(--text-dim); }

    .grid {
      display: grid; gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .app-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 26px 24px;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, border-color 0.18s ease;
      display: flex; flex-direction: column;
    }
    .app-card:hover { transform: translateY(-4px); border-color: var(--brand); }
    .app-card.soon { border-style: dashed; opacity: 0.78; }
    .app-card.soon:hover { transform: none; border-color: var(--card-border); }
    .app-head { display: flex; align-items: center; gap: 14px; }
    .app-ico {
      flex: none; width: 44px; height: 44px; border-radius: 14px;
      display: grid; place-items: center;
      background: rgba(91, 140, 255, 0.14); color: var(--brand);
    }
    .app-ico svg { width: 24px; height: 24px; }
    .app-name { font-size: 20px; font-weight: 600; }
    .app-ver { font-size: 13px; color: var(--text-dim); }
    .badge {
      margin-left: auto; align-self: flex-start; white-space: nowrap;
      font-size: 12px; padding: 3px 10px; border-radius: 999px;
      color: var(--text-dim); background: var(--card); border: 1px solid var(--card-border);
    }
    .app-desc { color: var(--text-dim); font-size: 14px; margin: 18px 0 12px; flex: 1; }
    .app-meta { font-size: 13px; color: var(--text-dim); }
    .app-actions { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 15px;
      text-decoration: none; color: #fff;
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn.disabled { opacity: 0.5; pointer-events: none; }
    .link { color: var(--brand); font-size: 14px; text-decoration: none; }
    .link:hover { text-decoration: underline; }

    .note {
      margin-top: 28px; font-size: 13px; color: var(--text-dim);
      background: var(--card); border: 1px dashed var(--card-border);
      border-radius: 12px; padding: 14px 16px;
    }
    .note a { color: var(--brand); text-decoration: none; }
    .note a:hover { text-decoration: underline; }
    footer { text-align: center; margin-top: 56px; color: var(--text-dim); font-size: 13px; }
    footer a { color: var(--brand); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
      </div>
      <h1>SAP Release</h1>
      <p class="tagline">发布的软件下载中心 · 最新版入口与版本说明</p>
    </header>

    <section>
      <h2 class="section-title">全部软件 <span class="count" id="app-count"></span></h2>
      <div class="grid" id="apps"></div>
      <noscript>
        <div class="note">
          当前浏览器禁用了 JavaScript，软件列表无法显示。可直接访问
          <a href="./notify/index.html">NotifyGuard 下载页</a>，或
          <a href="./notify/notify-guard.exe">下载单文件版</a>。
        </div>
      </noscript>
    </section>

    <div class="note">
      主页只提供每个工具的一个主下载链接；历史版本、增量更新包、单文件版等其他下载地址，
      请进入各软件自己的下载页查看。
    </div>

    <footer>
      <p>由 GitHub 自动发布 </p>
      <p style="margin-top:6px">© gsmhai · SAP Release</p>
    </footer>
  </div>

  <!--
    维护说明（新增软件时看这里）

    1. 在下方 APPS 数组加一项即可，字段含义：
       id          唯一标识，用于版本号元素的 id
       name/desc   展示名称与简介
       icon        图标名，见 ICONS；需要新图标就在 ICONS 里加一个
       platform    平台/包格式说明
       status      'live' = 已发布；'soon' = 即将上线（占位卡片，无下载按钮）
       downloadUrl 该工具在主页上的唯一主下载链接
       detailUrl   可选，子文件夹的 index.html，承载其他下载链接与版本说明；
                   不填则不渲染「查看全部版本」链接
       versionUrl  可选，指向子目录 latest.json，用于自动显示当前版本号

    2. sap-toolbox 已发布：主下载指向仓库根目录的 SAPToolbox.7z，
       该文件由 sap-toolbox 的 build-exe-auto.yml 在每次 push master 后自动覆盖；
       版本号取自 ./toolbox/latest.json（同样由该工作流生成）。

    3. 所有链接都用 ./ 相对路径，避免 GitHub Pages 项目站点
       /sap-release/ 前缀导致绝对路径失效。

    4. 本仓库由 CI 自动发布，请把本文件纳入源码仓库的发布产物，
       避免下次自动发布时被清空或覆盖。
  -->
  <script>
    const ICONS = {
      bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
      box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'
    };

    const APPS = [
      {
        id: "notify",
        name: "NotifyGuard",
        desc: "桌面通知与工时助手，常驻托盘、支持应用内自动更新。免安装、可放任意目录、可随 U 盘携带。",
        icon: "bell",
        platform: "Windows x64 · 绿色单文件版（推荐）· 免安装",
        status: "live",
        downloadUrl: "./notify/notify-guard.exe",
        downloadLabel: "下载单文件版",
        detailUrl: "./notify/index.html",
        versionUrl: "./notify/latest.json"
      },
      {
        id: "sap-toolbox",
        name: "SAP Toolbox",
        desc: "SAP 日常运维与批量处理工具集，支持应用内在线升级。7z 压缩包请用 7-Zip / WinRAR 解压后运行。",
        icon: "box",
        platform: "Windows x64 · 7z 压缩包 · 免安装",
        status: "live",
        downloadUrl: "./toolbox/SAPToolbox.7z",
        downloadLabel: "下载 7z 包",
        versionUrl: "./toolbox/latest.json"
      }
    ];

    const grid = document.getElementById("apps");
    grid.innerHTML = APPS.map(function (app) {
      const live = app.status === "live";
      const badge = live ? "" : '<span class="badge">即将上线</span>';
      const detailLink = app.detailUrl
        ? '<a class="link" href="' + app.detailUrl + '">查看全部版本与其他下载 →</a>'
        : '<span class="link link-placeholder" aria-hidden="true">查看全部版本与其他下载 →</span>';
      const actions = live
        ? '<a class="btn" href="' + app.downloadUrl + '" download>' + app.downloadLabel + '</a>' + detailLink
        : '<span class="btn disabled">敬请期待</span>' +
          '<span class="app-meta">发布后在此加入下载入口</span>';
      return '<article class="app-card' + (live ? "" : " soon") + '">' +
        '<div class="app-head">' +
          '<div class="app-ico">' + (ICONS[app.icon] || ICONS.box) + '</div>' +
          '<div><h3 class="app-name">' + app.name + '</h3>' +
          '<span class="app-ver" id="ver-' + app.id + '">' + (live ? "最新版本" : "尚未发布") + '</span></div>' +
          badge +
        '</div>' +
        '<p class="app-desc">' + app.desc + '</p>' +
        '<div class="app-meta">' + app.platform + '</div>' +
        '<div class="app-actions">' + actions + '</div>' +
      '</article>';
    }).join("");

    const liveCount = APPS.filter(function (a) { return a.status === "live"; }).length;
    document.getElementById("app-count").textContent = liveCount + " 款可用";

    APPS.filter(function (a) { return a.status === "live" && a.versionUrl; })
      .forEach(async function (app) {
        const el = document.getElementById("ver-" + app.id);
        try {
          const res = await fetch(app.versionUrl, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          el.textContent = "v" + (data.version || "最新版");
        } catch (e) {
          el.textContent = "最新版";
        }
      });
  </script>
</body>
</html>
